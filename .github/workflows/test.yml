name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      # Unit tests need no browser and no ffmpeg; the end-to-end recording test
      # skips itself unless AGENT_PROOF_E2E is set.
      - run: node --test
      # The published .d.ts files are generated from the JSDoc in src/, so a
      # wrong annotation is a real defect and CI has to catch it.
      - run: npx tsc -p tsconfig.json --noEmit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --no-audit --no-fund
      # Chrome is preinstalled on GitHub's Ubuntu runners.
      - run: AGENT_PROOF_E2E=1 node --test test/e2e.test.js
